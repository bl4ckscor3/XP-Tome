plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
	id 'net.neoforged.moddev' version '2.0.115'
}

version = '2.4.2'
group = 'bl4ckscor3.mod.xptome'

base {
	archivesName = 'xptome-1.21.10'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "21.10.11-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("runs/" + name)
			ideName = "XPTome " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'xpbook', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		xpbook {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('bl4ckscor3/mod/xptome/datagen/**') //exclude files from the built jar that are only used to generate the assets & data

    manifest {
        attributes(["Specification-Title": "XP Tome",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "XP Tome",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}